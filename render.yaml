services:
  - type: web
    name: attendance-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ATTENDANCE_DB_PATH
        value: /tmp/attendance_memory.db
